[project]
name = "procureai"
version = "0.1.0"
description = "Autonomous AI procurement agent for Apex Manufacturing"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "click>=8.3.3",
    "langgraph>=0.4.1",
    "langchain-anthropic>=0.3.12",
    "langchain-core>=0.3.49",
    "langchain-openai>=0.3.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic-settings>=2.9.1",
    "pypdf>=5.4.0",
    "rich>=13.0.0",
    "langchain>=1.2.15",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
